name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev dependencies
        run: python -m pip install -e ".[dev,hf]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

      # Exercise the new recipe field before its first OPBDH PyPI release,
      # while the preceding suite continues to cover the published dependency.
      - name: Test custom LoRA targets against integrated OPBDH source
        run: |
          python -m pip install 'opbdh[ft] @ git+https://github.com/lumpenspace/opbdh.git@3a71c4d224d8d296244f4bf41d7f4534beb8e2f0'
          python -c 'from opbdh.finetune import FineTuneProject; assert "lora_target_modules" in FineTuneProject.__dataclass_fields__'
          pytest tests/test_native_finetune.py -q
