[tool.poetry]
name = "raft"
version = "2.0.0"
description = "Retrieval-Augmented Fine-Tuning"
authors = ["lumpenspace <125578322+lumpenspace@users.noreply.github.com>"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.9"
chromadb = "^0.5.23"
openai = "^1.14.3"
beautifulsoup4 = "^4.12.3"
requests = "^2.31.0"
tiktoken = "^0.6.0"
pandas = "^2.2.1"
pynput = "^1.7.6"
python-dotenv = "^1.0.1"
# Tweet mode (`raft tweets`) and huggingface finetuning (`raft ft:run` with a
# non-OpenAI model). Both are used through their Python APIs, and raft degrades
# with an install hint when they are absent.
ariadne = {git = "https://github.com/lumpenspace/ariadne", optional = true}
opbdh = {version = "^1.3", optional = true}

[tool.poetry.extras]
tweets = ["ariadne"]
hf = ["opbdh"]
all = ["ariadne", "opbdh"]


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[tool.poetry.scripts]
raft = 'raft.cli:main'
